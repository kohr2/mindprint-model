# Training Pipeline Configuration
# Bob Loukas Mindprint - Last 2 Months Transcripts (Pilot)
# ORPO pilot run capped to 15 topics

backend:
  type: mlx
  device: auto
  dtype: float16

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: float16
  device: mps

orpo:
  steps_per_topic: 100
  learning_rate: 0.0003
  batch_size: 4
  lambda_orpo: 0.1
  lora_rank: 8
  lora_alpha: 16
  target_modules:
    - q_proj
    - v_proj
    - o_proj
    - up_proj
    - down_proj

thresholds:
  accuracy_threshold: 0.70
  topic_pass_threshold: 0.90

pipeline:
  merge_after_unit: true
  max_retries_per_topic: 2
  max_topics: 15
  early_stopping_enabled: false

paths:
  data_dir: ./data/bob_loukas/transcripts
  output_dir: ./output
  checkpoint_dir: ./checkpoints/transcripts_last2m_pilot15

logging:
  level: INFO
  log_file: ./logs/training_transcripts_last2m_pilot15.log
